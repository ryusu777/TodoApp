name: todoapp

services:
  front-end:
    build:
      context: .
      dockerfile: ./FrontEnd/Dockerfile
    ports:
      - "8080:3000"

  project-management:
    depends_on: 
      - rabbit-mq
    build:
      context: .
      dockerfile: ./ProjectManagement/Dockerfile
    environment:
      - ConnectionStrings__PostgreContext
      - ConnectionStrings__MassTransitDbContext
      - JwtOptions__SecretKey

  integration-context:
    depends_on: 
      - auth-context
    build:
      context: .
      dockerfile: ./IntegrationContext/Dockerfile
    environment:
      - ConnectionStrings__PostgreContext
      - ConnectionStrings__MassTransitDbContext
      - ClientUrl
      - JwtOptions__SecretKey

  auth-context:
    depends_on: 
      - project-management
    build:
      context: .
      dockerfile: ./AuthContext/Dockerfile
    environment:
      - ConnectionStrings__PostgreContext
      - JwtOptions__SecretKey

  api-gateway:
    build:
      context: .
      dockerfile: ./ApiGateway/Dockerfile
    ports:
      - "8081:80"

  rabbit-mq:
    image: rabbitmq:management
    ports:
      - "5672:5672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
